services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crystell_development}
      POSTGRES_USER: ${POSTGRES_USER:-crystell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - crystell_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-crystell} -d ${POSTGRES_DB:-crystell_development}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - crystell_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-crystell-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change-me-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - crystell_minio_data:/data

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    environment:
      RAILS_ENV: development
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://crystell:change-me-local-only@postgres:5432/crystell_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      SECRET_KEY_BASE: ${APP_SECRET_KEY_BASE:-change-me-local-only}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "ruby", "-rnet/http", "-e", "u=URI('http://127.0.0.1:3001/health'); exit(Net::HTTP.get_response(u).is_a?(Net::HTTPSuccess) ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./apps/api
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq"]
    environment:
      RAILS_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://crystell:change-me-local-only@postgres:5432/crystell_development}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      SECRET_KEY_BASE: ${APP_SECRET_KEY_BASE:-change-me-local-only}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai:8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai:
    build:
      context: ./services/ai
    restart: unless-stopped
    environment:
      CRYSTELL_ENV: ${CRYSTELL_ENV:-development}
      AI_INTERNAL_TOKEN: ${AI_INTERNAL_TOKEN:-change-me-local-only}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  crystell_postgres_data:
  crystell_redis_data:
  crystell_minio_data:
