name: Crystell CI

on:
  push:
    branches:
      - main
      - agent/crystell-**
    paths:
      - "crystell/**"
      - ".github/workflows/crystell-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "crystell/**"
      - ".github/workflows/crystell-ci.yml"

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose
        working-directory: crystell
        run: docker compose --env-file .env.example config

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install web dependencies
        working-directory: crystell/apps/web
        run: npm install
      - name: Audit production web dependencies
        working-directory: crystell/apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Type-check web
        working-directory: crystell/apps/web
        run: npm run typecheck
      - name: Build web
        working-directory: crystell/apps/web
        run: npm run build
      - name: Build web container
        working-directory: crystell/apps/web
        run: docker build -t crystell-web:ci .

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build API container
        working-directory: crystell/apps/api
        run: docker build -t crystell-api:ci .

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service
        working-directory: crystell/services/ai
        run: pip install .
      - name: Import application
        working-directory: crystell/services/ai
        run: python -c "from app.main import app; assert app.title == 'Crystell AI Service'"
      - name: Build AI container
        working-directory: crystell/services/ai
        run: docker build -t crystell-ai:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: [validate-compose, web, api, ai-service]
    steps:
      - uses: actions/checkout@v6
      - name: Start full Crystell stack
        working-directory: crystell
        run: ACCOUNT_LOCKOUT_SECONDS=2 docker compose --env-file .env.example up -d --build
      - name: Run health and readiness smoke tests
        working-directory: crystell
        run: sh scripts/smoke.sh
      - name: Verify identity, MFA, tenant authorization and sessions
        working-directory: crystell
        run: python3 scripts/identity_smoke.py
      - name: Verify persistent account lockout
        working-directory: crystell
        run: python3 scripts/lockout_smoke.py
      - name: Verify tenant, identity, billing, catalog, inventory, checkout and payment security boundaries
        working-directory: crystell
        run: |
          docker compose exec -T \
            -e RAILS_ENV=test \
            -e DATABASE_URL=postgresql://crystell_app:change-me-app-local-only@postgres:5432/crystell_development \
            api bundle exec rspec \
              spec/services/tenant_scope_spec.rb \
              spec/services/tenant_permission_spec.rb \
              spec/services/identity_delivery_spec.rb \
              spec/services/tenant_invitation_and_ownership_spec.rb \
              spec/services/tenant_resource_boundaries_spec.rb \
              spec/services/billing_foundation_spec.rb \
              spec/services/billing_promotions_spec.rb \
              spec/services/catalog_inventory_foundation_spec.rb \
              spec/services/category_hierarchy_spec.rb \
              spec/services/product_media_spec.rb \
              spec/services/inventory_ledger_authority_spec.rb \
              spec/services/reservation_expiry_job_spec.rb \
              spec/services/storefront_configuration_spec.rb \
              spec/services/checkout_foundation_spec.rb \
              spec/services/checkout_inventory_allocator_spec.rb \
              spec/services/payment_foundation_spec.rb \
              spec/requests/billing_permissions_spec.rb \
              spec/requests/catalog_inventory_permissions_spec.rb \
              spec/requests/storefront_permissions_spec.rb
      - name: Print service logs on failure
        if: failure()
        working-directory: crystell
        run: docker compose logs --no-color --tail=300
      - name: Stop stack
        if: always()
        working-directory: crystell
        run: docker compose down -v --remove-orphans
