name: Crystell CI

on:
  push:
    branches:
      - main
      - agent/crystell-**
    paths:
      - "crystell/**"
      - ".github/workflows/crystell-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "crystell/**"
      - ".github/workflows/crystell-ci.yml"

jobs:
  validate-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        working-directory: crystell
        run: docker compose --env-file .env.example config

  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install AI service
        working-directory: crystell/services/ai
        run: pip install .
      - name: Import application
        working-directory: crystell/services/ai
        run: python -c "from app.main import app; assert app.title == 'Crystell AI Service'"
      - name: Build AI container
        working-directory: crystell/services/ai
        run: docker build -t crystell-ai:ci .
